[package]
name = "rtnetlink"
version = "0.21.0"
authors = ["Corentin Henry <corentinhenry@gmail.com>"]
edition = "2021"
homepage = "https://github.com/rust-netlink/rtnetlink"
keywords = ["netlink", "ip", "linux"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rust-netlink/rtnetlink"
description = "manipulate linux networking resources via netlink"
rust-version = "1.71"

[features]
test_as_root = []
default = ["tokio_socket"]
tokio_socket = ["netlink-proto/tokio_socket", "tokio"]
smol_socket = ["netlink-proto/smol_socket", "async-global-executor"]

[dependencies]
futures-util = "0.3.32"
futures-channel = "0.3.32"
log = "0.4.30"
thiserror = "2"
netlink-sys = { version = "0.8" }
netlink-packet-utils = { version = "0.6.0" }
netlink-packet-core = { version = "0.8" }
netlink-packet-route = { git = "https://github.com/githedgehog/netlink-packet-route.git", branch = "pr/daniel-noland/swing6", default-features = false, features = [] }
netlink-proto = { default-features = false, version = "0.12.0" }
nix = { version = "0.31.3", default-features = false, features = ["fs", "mount", "sched", "signal"] }
tokio = { version = "1.52.3", features = ["rt"], optional = true}
async-global-executor = { version = "3.1.0", optional = true }

[dev-dependencies]
env_logger = "0.11.10"
ipnetwork = "0.21.1"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
async-std = { version = "1.13.2", features = ["attributes"] }
macaddr = "1.0"
